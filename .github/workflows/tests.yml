name: tests

on:
  push:
    branches: ["prod", "staging", "19.0", "dev/**"]   # 19.0 until it is deleted from the Odoo.sh console
  pull_request:
  workflow_dispatch:

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile every module file
        run: python -m compileall -q addons
      - name: Every XML data file is well formed
        run: |
          python - <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          bad = []
          for f in sorted(pathlib.Path("addons").rglob("*.xml")):
              try:
                  ET.parse(f)
              except ET.ParseError as exc:
                  bad.append(f"{f}: {exc}")
          print("\n".join(f"ok  {f}" for f in sorted(pathlib.Path('addons').rglob('*.xml'))))
          if bad:
              sys.exit("Malformed XML:\n" + "\n".join(bad))
          PY
      - name: Manifest declares every data file that exists
        run: python tools/check_manifest.py addons/elite_clearance addons/elite_clearance_teese
      - name: No known Odoo 19 install-time pitfalls
        run: python tools/check_view_pitfalls.py addons/elite_clearance addons/elite_clearance_teese

  odoo-tests:
    name: Odoo 19 test suite
    runs-on: ubuntu-latest
    container:
      image: odoo:19
      options: --user root
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Install both modules and run their tests
        shell: bash
        run: |
          set -euo pipefail
          odoo \
            -d ci_clearance \
            --db_host=db --db_port=5432 --db_user=odoo --db_password=odoo \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,"$GITHUB_WORKSPACE/addons" \
            -i elite_clearance,elite_clearance_teese \
            --with-demo \
            --test-enable --test-tags /elite_clearance,/elite_clearance_teese \
            --log-level=test \
            --stop-after-init \
            2>&1 | tee odoo.log

      - name: Fail on any test error in the log
        shell: bash
        run: |
          if grep -E "odoo\.tests.*(FAIL|ERROR)" odoo.log; then
            echo "::error::the suite did not pass"
            exit 1
          fi
          echo "suite green"

      - name: Both modules' suites actually ran
        shell: bash
        run: |
          for cls in TestClearanceFile TestLegacyImport; do
            if ! grep -q "Starting $cls\." odoo.log; then
              echo "::error::$cls never started - a module was not installed or its tests were not selected"
              exit 1
            fi
          done
          echo "both suites ran"

      - name: Keep the server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odoo-log
          path: odoo.log

  # Odoo.sh deploys a push to prod / staging by itself, through its webhook;
  # nothing here causes that. This job RECORDS the push against the matching
  # GitHub Environment, so the repository's Environments view shows what is
  # on each Odoo.sh stage and links to it. It runs only after the suite is
  # green, so a red build never appears as a deployment.
  record-deployment:
    name: Record deployment on ${{ github.ref_name }}
    needs: [static, odoo-tests]
    if: github.event_name == 'push' && (github.ref_name == 'prod' || github.ref_name == 'staging')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'prod' && 'production' || 'staging' }}
      url: ${{ github.ref_name == 'prod' && 'https://nekoutb-odoo-elite-ad.odoo.com' || 'https://www.odoo.sh/project/nekoutb-odoo-elite-ad' }}
    steps:
      - name: Note what Odoo.sh is deploying
        run: |
          echo "Odoo.sh builds branch '${{ github.ref_name }}' at ${{ github.sha }} on its own."
          echo "Recorded here against the '${{ github.ref_name == 'prod' && 'production' || 'staging' }}' environment."
