name: tests

on:
  push:
    branches: ["main", "19.0", "19.0-*", "staging", "dev*"]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile every module file
        run: python -m compileall -q addons
      - name: Every XML data file is well formed
        run: |
          python - <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          bad = []
          for f in sorted(pathlib.Path("addons").rglob("*.xml")):
              try:
                  ET.parse(f)
              except ET.ParseError as exc:
                  bad.append(f"{f}: {exc}")
          print("\n".join(f"ok  {f}" for f in sorted(pathlib.Path('addons').rglob('*.xml'))))
          if bad:
              sys.exit("Malformed XML:\n" + "\n".join(bad))
          PY
      - name: Manifest declares every data file that exists
        run: python tools/check_manifest.py addons/elite_clearance

  odoo-tests:
    name: Odoo 19 test suite
    runs-on: ubuntu-latest
    container:
      image: odoo:19
      options: --user root
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Install elite_clearance and run its tests
        shell: bash
        run: |
          set -euo pipefail
          odoo \
            -d ci_clearance \
            --db_host=db --db_port=5432 --db_user=odoo --db_password=odoo \
            --addons-path=/usr/lib/python3/dist-packages/odoo/addons,"$GITHUB_WORKSPACE/addons" \
            -i elite_clearance \
            --with-demo \
            --test-enable --test-tags /elite_clearance \
            --log-level=test \
            --stop-after-init \
            2>&1 | tee odoo.log

      - name: Fail on any test error in the log
        shell: bash
        run: |
          if grep -E "odoo\.tests.*(FAIL|ERROR)" odoo.log; then
            echo "::error::the elite_clearance suite did not pass"
            exit 1
          fi
          echo "suite green"

      - name: Keep the server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odoo-log
          path: odoo.log
