name: elimelec-caddy
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/elimelec/status:/srv/status:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
networks:
  web:
    external: true
volumes:
  caddy_data:
  caddy_config:
